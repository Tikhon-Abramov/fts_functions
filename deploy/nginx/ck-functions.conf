# Include under `http.server { ... }` in the main nginx.conf.
# Adjust $host and real upstream if multi-host.
#
# IMPORTANT: The `alias` path below (/var/www/ck-functions/) MUST match the
# real deploy target where the frontend `dist/` contents are copied during
# deployment. Update this path to match the actual on-disk location.

# Frontend static assets at /ck-functions/
location /ck-functions/ {
    alias /var/www/ck-functions/;     # where the dist is deployed
    try_files $uri $uri/ /ck-functions/index.html;
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
}

# API reverse-proxy: /ck-functions/api/ → localhost:3000/api/
location /ck-functions/api/ {
    proxy_pass http://127.0.0.1:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /ck-functions;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

# Versioned API: /ck-functions/v1/ → backend /v1/
location /ck-functions/v1/ {
    proxy_pass http://127.0.0.1:3000/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /ck-functions;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

